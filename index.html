<body>
<div class="topband" aria-hidden="true"></div>
<div class="wrap">
  <header>
    <div class="headrow">
      <div class="firm">id est avocats</div>
      <div class="toggles">
        <div class="theme" role="group" data-i18n-aria="langGroup" aria-label="Langue">
          <button type="button" data-lang-set="fr" lang="fr">FR</button><button type="button" data-lang-set="en" lang="en">EN</button>
        </div>
        <div class="theme" role="group" data-i18n-aria="themeGroup" aria-label="Affichage">
          <button type="button" data-theme-set="auto" data-i18n="themeAuto">Auto</button><button type="button" data-theme-set="light" data-i18n="themeLight">Clair</button><button type="button" data-theme-set="dark" data-i18n="themeDark">Sombre</button>
        </div>
      </div>
    </div>
    <h1><span data-i18n="title"></span><span class="beta">beta</span></h1>
    <p data-i18n="subtitle"></p>
    <div class="caution" role="note" data-i18n-html="caution"></div>
  </header>

  <div class="grid">
    <form class="panel" id="form" autocomplete="off" onsubmit="return false">
      <fieldset>
        <legend><span class="n">1</span><span data-i18n="lgCriteria"></span></legend>
        <label for="weight" data-i18n="lbWeight"></label>
        <input id="weight" type="number" min="0" max="100" step="1" value="40" inputmode="numeric">
        <div class="hint" data-i18n="hintWeight"></div>
        <label data-i18n="lbOthers"></label>
        <div class="rowlist" id="others"></div>
        <div class="sum" id="sumTxt"></div>
        <button type="button" class="add" id="addOther" data-i18n="addOther"></button>
      </fieldset>

      <fieldset>
        <legend><span class="n">2</span><span data-i18n="lgMethod"></span></legend>

<script>
// ===== Marchés publics – notation du prix : moteur (version 2) =====
// id est avocats, outil d'aide à la décision. À vérifier dans chaque cas.
// SPDX-License-Identifier: AGPL-3.0-or-later
// Méthodes : Guide romand pour les marchés publics (CROMP), annexe T2 (version du 1er mai 2026) ;
// méthode proportionnelle et méthode linéaire paramétrable.
const Notation = (() => {
  const NMAX = 5;
  const METHODS = ['T2', 'T15', 'T3', 'T200', 'T300', 'Tmoy', 'T1', 'Tlin'];
  const GAPS = [5, 10, 15, 20, 30, 50];
  const clamp = x => Math.max(0, Math.min(NMAX, x));

  // Note (0 à 5) d'une offre au prix P ; c : { pmin, pmean, n, est, x, tmoyMode }
  function noteOf(m, P, c) {
    const q = c.pmin / P;
    switch (m) {
      case 'T1': return clamp(NMAX * q);
      case 'T15': return clamp(NMAX * Math.pow(q, 1.5));
      case 'T2': return clamp(NMAX * q * q);
      case 'T3': return clamp(NMAX * q * q * q);
      case 'T200': return clamp(NMAX * (2 * c.pmin - P) / c.pmin);
      case 'T300': return clamp(NMAX * (3 * c.pmin - P) / (2 * c.pmin));
      case 'Tlin': { const x = Math.max(1, c.x || 100); return clamp(NMAX * (1 - (P - c.pmin) / (c.pmin * x / 100))); }
      case 'Tmoy': {
        if (c.tmoyMode !== 'mean' && c.n < 5) return c.est > 0 ? clamp(NMAX - (P - c.pmin) / c.est) : NaN;
        const d = c.pmean - c.pmin;
        return d > 0 ? clamp(NMAX - (P - c.pmin) / d) : NMAX;
      }
    }
    return NaN;
  }
  // Note en fonction de l'écart g (en %) par rapport à l'offre la moins chère, prix fictif 100
  const noteGap = (m, g, c) => noteOf(m, 100 * (1 + g / 100), Object.assign({ pmin: 100, pmean: 100, n: 99 }, c || {}));
  // Points sur 100 : note ÷ 5 × pondération du prix
  const pts = (note, w) => Number.isFinite(note) ? note / NMAX * w : NaN;
  // Avance nécessaire sur les autres critères (note moyenne pondérée, sur 5) pour compenser des points perdus
  const needed = (lost, w) => w >= 100 ? Infinity : lost / (100 - w) * NMAX;
  // Écart (%) à partir duquel la note vaut 0 (null si jamais)
  function zeroGap(m, c) {
    switch (m) {
      case 'T200': return 100;
      case 'T300': return 200;
      case 'Tlin': return Math.max(1, (c && c.x) || 100);
      case 'Tmoy': {
        if (!c || !c.pmin) return null;
        if (c.tmoyMode !== 'mean' && c.n < 5) return c.est > 0 ? NMAX * c.est / c.pmin * 100 : null;
        return c.pmean > c.pmin ? NMAX * (c.pmean - c.pmin) / c.pmin * 100 : null;
      }
    }
    return null;
  }
  // Tableau d'impact pour les écarts usuels (sans prix) ; Tmoyenne exclue car elle dépend des offres
  function impact(cfg, m) {
    const method = m || cfg.method, w = cfg.weight;
    if (method === 'Tmoy' && !(cfg.offers && cfg.offers.length)) return null;
    const c = ctx(cfg);
    return GAPS.map(g => {
      const note = method === 'Tmoy' ? noteOf(method, c.pmin * (1 + g / 100), c) : noteGap(method, g, cfg);
      const p = pts(note, w), lost = w - p;
      return { gap: g, note, pts: p, lost, needed: needed(lost, w) };
    });
  }
  function ctx(cfg) {
    const prices = (cfg.offers || []).map(o => o.price).filter(p => p > 0);
    const n = prices.length;
    const pmin = n ? Math.min(...prices) : 100, pmean = n ? prices.reduce((a, b) => a + b, 0) / n : 100;
    return { pmin, pmean, n, est: cfg.est, x: cfg.x, tmoyMode: cfg.tmoyMode };
  }
  // Offres prévues : note, points et points perdus par rapport à l'offre la moins chère, pour une méthode
  function evaluate(cfg, m) {
    const method = m || cfg.method, w = cfg.weight, c = ctx(cfg);
    if (!c.n) return null;
    const rows = (cfg.offers || []).filter(o => o.price > 0).map(o => {
      const note = noteOf(method, o.price, c), p = pts(note, w), lost = w - p;
      return { id: o.id, price: o.price, gap: (o.price / c.pmin - 1) * 100, note, pts: p, lost, needed: needed(lost, w) };
    });
    return { method, rows, pmin: c.pmin, pmean: c.pmean, n: c.n, ok: rows.every(r => Number.isFinite(r.note)), zero: zeroGap(method, c) };
  }
  // Courbe des points en fonction de l'écart (0 à gmax %)
  function curve(cfg, m, gmax, step) {
    const method = m || cfg.method, c = ctx(cfg), out = [];
    for (let g = 0; g <= gmax + 1e-9; g += step) {
      const note = method === 'Tmoy' ? (c.n ? noteOf(method, c.pmin * (1 + g / 100), c) : NaN) : noteGap(method, g, cfg);
      out.push({ g, pts: pts(note, cfg.weight) });
    }
    return out;
  }
  // Contrôles
  function checks(cfg) {
    const a = [], w = cfg.weight, c = ctx(cfg), n = c.n;
    if (w < 20 || w > 80) a.push({ lvl: 'warn', k: 'weightRange' });
    if (cfg.others && Math.abs(cfg.others.reduce((s, o) => s + (o.weight || 0), 0) + w - 100) > 0.01) a.push({ lvl: 'warn', k: 'weightSum' });
    if (cfg.method === 'Tmoy') {
      if (n === 0) a.push({ lvl: 'info', k: 'tmoyNeedsPrices' });
      else if (n < 5) a.push({ lvl: 'warn', k: cfg.tmoyMode === 'mean' ? 'tmoyMeanFew' : 'tmoyEst' });
    }
    if (cfg.method === 'Tlin') a.push({ lvl: 'info', k: 'linX', data: Math.max(1, cfg.x || 100) });
    if (n >= 2) {
      const ev = evaluate(cfg);
      if (ev && ev.ok) {
        const zeros = ev.rows.filter(r => r.note <= 0).length;
        if (zeros >= 1 && n - zeros >= 1) a.push({ lvl: 'warn', k: 'zeroNotes', data: zeros });
        const maxGap = Math.max(...ev.rows.map(r => r.gap));
        if (ev.zero !== null && ev.zero < maxGap) a.push({ lvl: 'info', k: 'rangeCover', data: Math.round(ev.zero) });
        if (n === 2) a.push({ lvl: 'info', k: 'twoOffers' });
      }
      if (ev && !ev.ok) a.push({ lvl: 'warn', k: 'tmoyNoEst' });
    }
    a.push({ lvl: 'info', k: 'announce' });
    return a;
  }
  return { NMAX, METHODS, GAPS, noteOf, noteGap, pts, needed, zeroGap, impact, evaluate, curve, checks };
})();

</script>

const T = () => STR[LANG];
const N = Notation;
const fmt = v => Number.isFinite(v) ? Math.round(v).toLocaleString(LANG === 'fr' ? 'de-CH' : 'en-GB') : '—';
const f1 = v => Number.isFinite(v) ? (Math.round(v * 10) / 10).toLocaleString(LANG === 'fr' ? 'fr-CH' : 'en-GB', { minimumFractionDigits: 1, maximumFractionDigits: 1 }) : '—';
const f2 = v => Number.isFinite(v) ? (Math.round(v * 100) / 100).toLocaleString(LANG === 'fr' ? 'fr-CH' : 'en-GB', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) : '—';
const pct = g => { const v = Math.abs(g - Math.round(g)) < 0.05 ? String(Math.round(g)) : f1(g); return LANG === 'fr' ? `+${v} %` : `+${v}%`; };
const num = s => { const x = parseFloat($(s).value); return Number.isFinite(x) ? x : 0; };
const mLabel = m => T().mLabel[m] || m;

// ---------- Critères et offres (lignes dynamiques) ----------
let others = [], offers = [], oid = 0, cid = 0;
function renderOthers() {
  const t = T(), box = $('#others'); box.innerHTML = '';
  others.forEach(o => {
    const row = document.createElement('div'); row.className = 'crow';
    row.innerHTML = `<input type="text" aria-label="${t.lbCritName}" placeholder="${t.phCrit}" value="${esc(o.name)}"><input type="number" min="0" max="100" step="1" inputmode="numeric" aria-label="${t.lbCritWeight}" placeholder="%" value="${o.weight === '' ? '' : o.weight}"><button type="button" class="del" aria-label="${t.remove}" title="${t.remove}">×</button>`;
    const [nm, wt, del] = row.children;
    nm.oninput = () => { o.name = nm.value; update(); }; wt.oninput = () => { o.weight = wt.value === '' ? '' : parseFloat(wt.value); update(); };
    del.onclick = () => { others = others.filter(x => x !== o); renderOthers(); update(); };
    box.appendChild(row);
  });
}
function renderOffers() {
  const t = T(), box = $('#offers'); box.innerHTML = '';
  offers.forEach((o, i) => {
    const row = document.createElement('div'); row.className = 'orow';
    row.innerHTML = `<span class="olab">${t.offerN(i + 1)}</span><input type="number" min="0" step="1000" inputmode="numeric" aria-label="${t.offerN(i + 1)} – ${t.lbPrice}" placeholder="${t.lbPrice}" value="${o.price > 0 ? o.price : ''}"><button type="button" class="del" aria-label="${t.remove}" title="${t.remove}">×</button>`;
    const [, inp, del] = row.children;
    inp.oninput = () => { o.price = parseFloat(inp.value) || 0; update(); };
    del.onclick = () => { offers = offers.filter(x => x !== o); renderOffers(); update(); };
    box.appendChild(row);
  });
}
$('#addOther').onclick = () => { others.push({ id: ++cid, name: '', weight: '' }); renderOthers(); update(); $('#others .crow:last-child input').focus(); };
$('#addOffer').onclick = () => { offers.push({ id: ++oid, price: 0 }); renderOffers(); update(); $('#offers .orow:last-child input').focus(); };
$('#example').onclick = () => { offers = [{ id: ++oid, price: 1000000 }, { id: ++oid, price: 1080000 }, { id: ++oid, price: 1150000 }, { id: ++oid, price: 1300000 }]; $('#est').value = 1200000; renderOffers(); update(); };
$('#clearOffers').onclick = () => { offers = [{ id: ++oid, price: 0 }, { id: ++oid, price: 0 }, { id: ++oid, price: 0 }]; renderOffers(); update(); };
function defaults() {
  const t = T();
  others = [{ id: ++cid, name: t.defOthers[0], weight: 40 }, { id: ++cid, name: t.defOthers[1], weight: 20 }];
  offers = [{ id: ++oid, price: 0 }, { id: ++oid, price: 0 }, { id: ++oid, price: 0 }];
  $('#weight').value = 40; $('#method').value = 'T2'; $('#x').value = 50; $('#tmoyMode').value = 'guide'; $('#est').value = ''; $('#cmp').checked = true;
  renderOthers(); renderOffers();
}

// ---------- Graphique ----------
function chart(cfg, show) {
  const t = T(), W = 680, H = 320, L = 46, R = 70, Tp = 14, B = 34, w = cfg.weight;
  const gmax = Math.max(50, Math.min(200, Math.ceil(Math.max(0, ...(offersGaps(cfg) || [0])) / 10) * 10 + 10));
  const sx = g => L + g / gmax * (W - L - R), sy = p => Tp + (1 - (w > 0 ? p / w : 0)) * (H - Tp - B);
  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${t.chartAria}">`;
  // grille
  const ysteps = 5;
  for (let i = 0; i <= ysteps; i++) { const p = w * i / ysteps, y = sy(p); s += `<line class="grid" x1="${L}" x2="${W - R}" y1="${y}" y2="${y}"/><text x="${L - 6}" y="${y + 4}" text-anchor="end">${f1(p).replace('.0', '')}</text>`; }
  const xstep = gmax <= 60 ? 10 : gmax <= 120 ? 20 : 50;
  for (let g = 0; g <= gmax; g += xstep) { const x = sx(g); s += `<line class="grid" x1="${x}" x2="${x}" y1="${Tp}" y2="${H - B}"/><text x="${x}" y="${H - B + 14}" text-anchor="middle">+${g} %</text>`; }
  s += `<line class="ax" x1="${L}" x2="${W - R}" y1="${H - B}" y2="${H - B}"/><line class="ax" x1="${L}" x2="${L}" y1="${Tp}" y2="${H - B}"/>`;
  s += `<text x="${(L + W - R) / 2}" y="${H - 4}" text-anchor="middle">${t.axGap}</text><text transform="translate(12 ${(Tp + H - B) / 2}) rotate(-90)" text-anchor="middle">${t.axPts}</text>`;
  const methods = show ? N.METHODS.filter(m => m !== cfg.method && !(m === 'Tmoy' && !offers.some(o => o.price > 0))) : [];
  const path = m => { const pts = N.curve(cfg, m, gmax, gmax / 100).filter(p => Number.isFinite(p.pts)); return pts.length ? 'M' + pts.map(p => `${sx(p.g).toFixed(1)} ${sy(p.pts).toFixed(1)}`).join(' L') : ''; };
  const endLabel = (m, cls) => { const pts = N.curve(cfg, m, gmax, gmax / 100).filter(p => Number.isFinite(p.pts)); if (!pts.length) return ''; const e = pts[pts.length - 1]; return `<text class="lbl ${cls}" x="${W - R + 4}" y="${sy(e.pts) + 4}">${esc(mLabel(m))}</text>`; };
  methods.forEach(m => { s += `<path class="oth" d="${path(m)}"/>` + endLabel(m, ''); });
  s += `<path class="sel" d="${path(cfg.method)}"/>` + endLabel(cfg.method, 'sel');
  const ev = N.evaluate(cfg);
  if (ev && ev.ok) ev.rows.forEach((r, i) => { if (r.gap <= gmax) s += `<circle class="dot" cx="${sx(r.gap)}" cy="${sy(r.pts)}" r="4.5"/><text class="dotl" x="${sx(r.gap) + 7}" y="${sy(r.pts) - 7}">${t.offerN(i + 1)}</text>`; });
  s += '</svg>';
  return s;
}
const offersGaps = cfg => { const ev = N.evaluate(cfg); return ev ? ev.rows.map(r => r.gap) : null; };

// ---------- Calcul et affichage ----------
function cfgOf() {
  return { method: $('#method').value, weight: num('#weight'), x: num('#x'), tmoyMode: $('#tmoyMode').value, est: num('#est'), others: others.map(o => ({ name: o.name, weight: o.weight === '' ? 0 : o.weight })), offers: offers.map(o => ({ id: o.id, price: o.price })) };
}
function update() {
  const t = T(), cfg = cfgOf(), m = cfg.method, w = cfg.weight, cmp = $('#cmp').checked;
  $('#xBox').hidden = m !== 'Tlin'; $('#tmoyBox').hidden = m !== 'Tmoy';
  $('#mDesc').textContent = t.mDesc[m]; $('#formula').innerHTML = t.formula[m];
  const sumO = cfg.others.reduce((s, o) => s + o.weight, 0), tot = sumO + w;
  $('#sumTxt').textContent = t.sumTxt(fmt(w), fmt(sumO), fmt(tot)); $('#sumTxt').className = 'sum' + (Math.abs(tot - 100) > 0.01 ? ' bad' : '');
  // alertes
  const alerts = N.checks(cfg).map(a => `<div class="alert ${a.lvl}">${typeof t.n[a.k] === 'function' ? t.n[a.k](a.data) : t.n[a.k]}</div>`);
  $('#rAlerts').innerHTML = alerts.join('');
  // bandeau : écart de 10 %
  const imp = N.impact(cfg);
  $('#hlLabel').textContent = t.hlLabel(mLabel(m), fmt(w));
  if (imp && Number.isFinite(imp[1].pts)) { $('#hlTotal').textContent = t.hlTotal(f1(imp[1].lost)); $('#hlRange').textContent = t.hlRange(f2(imp[1].needed), fmt(100 - w)); }
  else { $('#hlTotal').textContent = '—'; $('#hlRange').textContent = t.hlNoData; }
  // graphique
  $('#chartWrap').innerHTML = chart(cfg, cmp); $('#chartHint').textContent = cmp ? t.chartHintCmp : t.chartHint;
  // tableau d'impact
  if (imp) $('#impact').innerHTML = `<thead><tr><th>${t.thGap}</th><th class="num">${t.thNote}</th><th class="num">${t.thPts}</th><th class="num">${t.thLost}</th><th class="num">${t.thNeeded}</th></tr></thead><tbody>` + imp.map(r => `<tr><td>${pct(r.gap)}</td><td class="num">${f2(r.note)}</td><td class="num">${f1(r.pts)}</td><td class="num">${f1(r.lost)}</td><td class="num">${Number.isFinite(r.needed) ? f2(r.needed) : '—'}</td></tr>`).join('') + '</tbody>';
  else $('#impact').innerHTML = `<tbody><tr><td>${t.tmoyNeedsPricesShort}</td></tr></tbody>`;
  // comparaison des méthodes (écarts usuels)
  $('#cmpOut').hidden = !cmp;
  if (cmp) {
    const ms = N.METHODS.filter(x => x !== 'Tmoy' || offers.some(o => o.price > 0));
    $('#cmpTable').innerHTML = `<thead><tr><th>${t.thGap}</th>${ms.map(x => `<th class="num${x === m ? ' sel' : ''}">${esc(mLabel(x))}</th>`).join('')}</tr></thead><tbody>` + N.GAPS.map(g => `<tr><td>${pct(g)}</td>${ms.map(x => { const r = N.impact(cfg, x); const v = r ? r.find(z => z.gap === g).lost : NaN; return `<td class="num"${x === m ? ' style="font-weight:700"' : ''}>${f1(v)}</td>`; }).join('')}</tr>`).join('') + `</tbody>`;
  }
  // offres prévues
  const ev = N.evaluate(cfg);
  $('#offOut').hidden = !(ev && ev.n >= 1);
  if (ev && ev.n >= 1) {
    $('#offTable').innerHTML = `<thead><tr><th>${t.thOffer}</th><th class="num">${t.thPrice}</th><th class="num">${t.thGap}</th><th class="num">${t.thNote}</th><th class="num">${t.thPts}</th><th class="num">${t.thLost}</th><th class="num">${t.thNeeded}</th></tr></thead><tbody>` + ev.rows.map((r, i) => `<tr><td>${t.offerN(i + 1)}</td><td class="num">${fmt(r.price)}</td><td class="num">${pct(r.gap)}</td><td class="num">${f2(r.note)}</td><td class="num">${f1(r.pts)}</td><td class="num">${f1(r.lost)}</td><td class="num">${Number.isFinite(r.needed) ? f2(r.needed) : '—'}</td></tr>`).join('') + '</tbody>';
    $('#offCmpOut').hidden = !cmp;
    if (cmp) $('#offCmp').innerHTML = `<thead><tr><th>${t.thOffer}</th>${N.METHODS.map(x => `<th class="num">${esc(mLabel(x))}</th>`).join('')}</tr></thead><tbody>` + ev.rows.map((r, i) => `<tr><td>${t.offerN(i + 1)} (${pct(r.gap)})</td>${N.METHODS.map(x => { const e2 = N.evaluate(cfg, x); const v = e2 ? e2.rows[i].lost : NaN; return `<td class="num"${x === m ? ' style="font-weight:700"' : ''}>${f1(v)}</td>`; }).join('')}</tr>`).join('') + '</tbody>';
  }
  // textes
  const plain = s => s.replace(/<sup>([^<]*)<\/sup>/g, '^$1').replace(/<[^>]+>/g, '');
  const L = [t.sumHead, '', t.sumWeight(fmt(w), cfg.others.map(o => `${o.name || t.phCrit} ${fmt(o.weight)} %`).join(', ')), t.sumMethod(mLabel(m), plain(t.formula[m])), ''];
  if (imp) { L.push(t.sumImpactHead); imp.forEach(r => L.push(t.sumImpactRow(pct(r.gap), f2(r.note), f1(r.lost), Number.isFinite(r.needed) ? f2(r.needed) : '—'))); }
  if (ev && ev.n >= 1 && ev.ok) { L.push('', t.sumOffersHead); ev.rows.forEach((r, i) => L.push(t.sumOfferRow(t.offerN(i + 1), fmt(r.price), pct(r.gap), f2(r.note), f1(r.lost)))); }
  L.push('', t.sumEnd);
  $('#txtSum').value = L.join('\n');
  $('#txtDoc').value = t.docText(mLabel(m), plain(t.formula[m]), fmt(w), m === 'Tlin' ? Math.max(1, cfg.x) : null, m === 'Tmoy' ? cfg.tmoyMode : null, !['T1', 'Tlin'].includes(m));
}

$('#copySum').onclick = copy('#copySum', '#txtSum'); $('#copyDoc').onclick = copy('#copyDoc', '#txtDoc');
$('#print').onclick = () => window.print();
$('#reset').onclick = () => { defaults(); update(); };
['#weight', '#method', '#x', '#tmoyMode', '#est', '#cmp'].forEach(s => { $(s).addEventListener('input', update); $(s).addEventListener('change', update); });
function translate() {
  const t = T();
  document.querySelectorAll('[data-i18n]').forEach(e => { const v = t[e.dataset.i18n]; if (typeof v === 'string') e.textContent = v; });
  document.querySelectorAll('[data-i18n-html]').forEach(e => { e.innerHTML = t[e.dataset.i18nHtml]; });
  document.querySelectorAll('[data-i18n-aria]').forEach(e => { e.setAttribute('aria-label', t[e.dataset.i18nAria]); });
  $('#principles').innerHTML = t.principles.map(p => `<li>${p}</li>`).join('');
  $('#disclaimerText').innerHTML = t.disclaimer.map(p => `<p>${esc(p)}</p>`).join('');
}
function applyLang(first) {
  document.documentElement.lang = LANG; document.title = T().pageTitle;
  document.querySelectorAll('[data-lang-set]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.langSet === LANG)));
  translate();
  if (first) defaults(); else { others.forEach((o, i) => { if (STR.fr.defOthers.includes(o.name) || STR.en.defOthers.includes(o.name)) o.name = T().defOthers[Math.max(0, STR.fr.defOthers.indexOf(o.name), STR.en.defOthers.indexOf(o.name))] || o.name; }); renderOthers(); renderOffers(); }
  setSource(); update();
}
document.querySelectorAll('[data-lang-set]').forEach(b => b.addEventListener('click', () => { LANG = b.dataset.langSet; store.set('lang', LANG); applyLang(false); }));
function applyTheme(th) { if (th === 'light' || th === 'dark') document.documentElement.setAttribute('data-theme', th); else document.documentElement.removeAttribute('data-theme'); document.querySelectorAll('[data-theme-set]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.themeSet === (th || 'auto')))); }
document.querySelectorAll('[data-theme-set]').forEach(b => b.addEventListener('click', () => { store.set('theme', b.dataset.themeSet); applyTheme(b.dataset.themeSet); }));
applyTheme(store.get('theme', 'auto'));
function setSource() { const h = location.hostname; if (/\.github\.io$/.test(h)) { const user = h.split('.')[0], repo = location.pathname.split('/').filter(Boolean)[0]; const url = `https://github.com/${user}${repo ? '/' + repo : ''}`; $('#srcLink').innerHTML = `${T().source} <a href="${url}">${url.replace('https://', '')}</a>`; } else $('#srcLink').hidden = true; }
const qs = new URLSearchParams(location.search); if (qs.get('lang') === 'en' || qs.get('lang') === 'fr') { LANG = qs.get('lang'); store.set('lang', LANG); }
applyLang(true);
})();
</script>
</body>
</html>
