<html lang="fr">
<head>
<meta charset="utf-8">
<script>try { var t = localStorage.getItem('idest-notation:theme'); if (t) { t = JSON.parse(t); if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); } } catch (e) {}</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Simulation de la notation du prix et du classement des offres en marchés publics (Guide romand : T1,5, T2, T3, T200, T300, Tmoyenne), avec classement, seuils de bascule et comparaison des méthodes. id est avocats.">
<title>Marchés publics – notation du prix, id est avocats</title>
<style>


:root{
  --rose:#E61E6E; --anthra:#333334; --turq:#069297; --orange:#F7A823; --cream:#FDF1DC; --lrose:#FAE0EB; --lgrey:#F2F2F2;
  --bg:#F2F2F2; --panel:#FFFFFF; --ink:#333334; --muted:#68686C; --line:#DEDDE1; --field:#FFFFFF;
  --date:#C8155C;
  --ok-bg:#E3F3F3; --ok-ink:#05666A; --ok-line:#9ED3D4;
  --warn-bg:#FDF1DC; --warn-ink:#7A4D00; --warn-line:#F7A823;
  --bad-bg:#FAE0EB; --bad-ink:#9E0F47; --bad-line:#E61E6E;
  --info-bg:#F2F2F2; --info-ink:#333334; --info-line:#DEDDE1;
  --nbg:#333334; --legal-bg:#F2F2F2; --caution-bg:#FDF1DC; --caution-ink:#5A3A00; --auto-bg:#E3F3F3;
  --font:Arial,"Helvetica Neue",Helvetica,sans-serif;
  --head:"Grandview","Grandview Display",Arial,"Helvetica Neue",Helvetica,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#1B1B1C; --panel:#252526; --ink:#F2F2F2; --muted:#B3B3B8; --line:#3A3A3D; --field:#1F1F20; --date:#FF6FA5;
    --ok-bg:#0F2E2F; --ok-ink:#8ED9DB; --ok-line:#1F5D5F;
    --warn-bg:#352812; --warn-ink:#FFD58A; --warn-line:#8A6418;
    --bad-bg:#3A1424; --bad-ink:#FFA9CA; --bad-line:#8E1F4C;
    --info-bg:#2C2C2E; --info-ink:#E6E6E8; --info-line:#3A3A3D; --nbg:#E61E6E; --legal-bg:#2C2C2E; --caution-bg:#352812; --caution-ink:#FFD58A; --auto-bg:#0F2E2F; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1B1B1C; --panel:#252526; --ink:#F2F2F2; --muted:#B3B3B8; --line:#3A3A3D; --field:#1F1F20; --date:#FF6FA5;
  --ok-bg:#0F2E2F; --ok-ink:#8ED9DB; --ok-line:#1F5D5F;
  --warn-bg:#352812; --warn-ink:#FFD58A; --warn-line:#8A6418;
  --bad-bg:#3A1424; --bad-ink:#FFA9CA; --bad-line:#8E1F4C;
  --info-bg:#2C2C2E; --info-ink:#E6E6E8; --info-line:#3A3A3D; --nbg:#E61E6E; --legal-bg:#2C2C2E; --caution-bg:#352812; --caution-ink:#FFD58A; --auto-bg:#0F2E2F; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
html{background:var(--bg);scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15.5px;line-height:1.5;-webkit-text-size-adjust:100%}
.topband{height:6px;background:var(--rose)}
.wrap{max-width:1140px;margin:0 auto;padding:26px 20px 40px}
header{position:relative;padding-right:28px}
header::after{content:"";position:absolute;right:0;top:4px;width:6px;height:64px;background:var(--orange)}
.firm{font-weight:700;color:var(--rose);font-size:14px;letter-spacing:.01em}
h1{font-family:var(--head);font-size:34px;line-height:1.12;font-weight:700;margin:4px 0 0;letter-spacing:-.01em}
header p{margin:8px 0 0;color:var(--muted);max-width:72ch}
.caution{margin-top:16px;background:var(--caution-bg);color:var(--caution-ink);border-left:5px solid var(--orange);border-radius:6px;padding:11px 14px;font-size:14.5px;max-width:84ch}
.caution b{font-weight:700}
.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.02fr);gap:22px;margin-top:22px;align-items:start}
@media (max-width:920px){.grid{grid-template-columns:1fr}}
.panel{background:var(--panel);border:1px solid var(--line);border-top:4px solid var(--rose);border-radius:8px;padding:20px}
.result{position:sticky;top:16px;border-top-color:var(--turq)}
@media (max-width:920px){.result{position:static}}
fieldset{border:0;margin:0 0 20px;padding:0}
fieldset:last-of-type{margin-bottom:0}
legend{font-family:var(--head);font-weight:700;font-size:17px;margin-bottom:8px;padding:0;display:flex;gap:10px;align-items:center}
legend .n{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--nbg);color:#fff;font-size:13px;font-family:var(--font)}
label{display:block;font-weight:700;font-size:14px;margin:12px 0 5px}
.hint{font-size:13px;color:var(--muted);margin-top:5px}
select,input[type=date],input[type=number]{width:100%;font:inherit;font-size:15.5px;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:6px;padding:10px 11px;min-height:44px}
select:focus,input:focus,button:focus-visible,summary:focus-visible{outline:3px solid color-mix(in srgb,var(--rose) 40%,transparent);outline-offset:1px;border-color:var(--rose)}
.row{display:grid;grid-template-columns:1fr 140px;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{font:inherit;font-size:14px;font-weight:700;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:999px;padding:7px 13px;cursor:pointer}
.chips button[aria-pressed="true"]{background:var(--rose);border-color:var(--rose);color:#fff}
.radios{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.radios label,.check{display:flex;gap:9px;align-items:flex-start;font-weight:400;margin:0;font-size:14.5px;cursor:pointer}
.radios input,.check input{width:18px;height:18px;margin-top:2px;accent-color:var(--rose);flex:none}
.check{margin-top:10px}
.sub{margin-left:27px}
.or{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px;margin:14px 0 2px}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.legal{margin-top:10px;font-size:13.5px;color:var(--muted);background:var(--legal-bg);border-radius:6px;padding:9px 11px;display:flex;justify-content:space-between;gap:10px;align-items:center}
.legal.ok{background:var(--ok-bg);color:var(--ok-ink)} .legal.warn{background:var(--warn-bg);color:var(--warn-ink)}
input.auto{background:var(--auto-bg);font-weight:700}
.opt{font-weight:400;color:var(--muted);font-size:13px}
.headrow{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.theme{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--panel)}
.theme button{font:inherit;font-size:12.5px;font-weight:700;color:var(--muted);background:transparent;border:0;padding:5px 11px;cursor:pointer}
.theme button[aria-pressed="true"]{background:var(--anthra);color:#fff}
.beta{display:inline-block;vertical-align:middle;margin-left:10px;font-family:var(--font);font-size:12px;font-weight:700;color:var(--rose);border:1.5px solid var(--rose);border-radius:999px;padding:1px 8px;letter-spacing:.02em}
.legal b{color:var(--ink)}
.linkish{font:inherit;font-size:13.5px;font-weight:700;color:var(--rose);background:none;border:0;padding:3px 0;cursor:pointer;text-decoration:underline;text-underline-offset:3px;white-space:nowrap}

.r-label{font-size:14px;color:var(--muted);font-weight:700}
.date{font-family:var(--head);font-size:clamp(26px,4vw,38px);line-height:1.12;font-weight:700;color:var(--date);margin:4px 0 8px}
.date.empty{color:var(--muted);font-weight:400;font-size:19px;font-family:var(--font)}
.chip{display:inline-block;font-size:13px;font-weight:700;border-radius:999px;padding:3px 10px}
.chip.ok{background:var(--ok-bg);color:var(--ok-ink)} .chip.soon{background:var(--warn-bg);color:var(--warn-ink)} .chip.late{background:var(--bad-bg);color:var(--bad-ink)}
.alerts{display:flex;flex-direction:column;gap:8px;margin:14px 0 0}
.alert{border-radius:6px;padding:10px 12px;font-size:14.5px;border:1px solid;border-left-width:5px}
.alert.ok{background:var(--ok-bg);color:var(--ok-ink);border-color:var(--ok-line);border-left-color:var(--turq)}
.alert.warn{background:var(--warn-bg);color:var(--warn-ink);border-color:var(--warn-line)}
.alert.bad{background:var(--bad-bg);color:var(--bad-ink);border-color:var(--bad-line)}
.alert.info{background:var(--info-bg);color:var(--info-ink);border-color:var(--info-line)}
.alert b{font-weight:700}
.alert .linkish{color:inherit;padding:0;margin-left:4px}
.tl{margin-top:18px}
.bar{display:flex;height:14px;border-radius:4px;overflow:hidden;background:var(--line)}
.bar span{display:block;height:100%}
.bar .c{background:var(--turq)}
.bar .s{background:repeating-linear-gradient(135deg,var(--muted) 0 2px,transparent 2px 6px);opacity:.6}
.bar .x{background:var(--orange)}
.tl-ends{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);margin-top:5px}
.legendrow{display:flex;flex-wrap:wrap;gap:12px;font-size:12.5px;color:var(--muted);margin-top:6px}
.legendrow i{display:inline-block;width:12px;height:12px;border-radius:2px;margin-right:5px;vertical-align:-2px}
h2{font-family:var(--head);font-size:16.5px;margin:20px 0 6px}
ol.steps{margin:0;padding-left:22px}
ol.steps li{margin:5px 0;font-size:14.5px}
.ref{color:var(--muted);font-size:13px}
ul.rules{margin:0;padding-left:18px;font-size:14px;color:var(--muted)}
ul.rules li{margin:4px 0}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.btn{font:inherit;font-weight:700;font-size:14.5px;border-radius:6px;padding:10px 16px;cursor:pointer;border:1px solid var(--rose);background:var(--rose);color:#fff}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
footer{margin-top:30px;color:var(--muted);font-size:13px}
footer .inner{max-width:92ch}
footer p{margin:6px 0}
details{margin-top:10px;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px 14px}
summary{cursor:pointer;font-weight:700;color:var(--ink)}
details p{color:var(--ink);font-size:13.5px}
footer a{color:var(--rose)}
.bottomband{background:var(--rose);color:#fff;font-size:13px;margin-top:26px}
.bottomband .wrap{padding-top:12px;padding-bottom:12px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (max-width:520px){h1{font-size:28px}.row{grid-template-columns:1fr 112px}.panel{padding:16px}header::after{height:48px}}
@media print{.topband,.bottomband,.caution,form,.actions,details{display:none!important}.grid{display:block}.panel{border:0}body{background:#fff}}

.cards{display:flex;flex-direction:column;gap:12px}
.card{border:1px solid var(--line);border-left:4px solid var(--turq);border-radius:6px;padding:12px 12px 10px;background:var(--field)}
.card.pay{border-left-color:var(--orange)}
.card-head{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:700;font-size:14px}
.card .grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.card .grid3{display:grid;grid-template-columns:1.3fr 1fr 0.7fr;gap:8px}
.card label{margin:8px 0 4px;font-size:13px}
.card input[type=text]{width:100%;font:inherit;font-size:15px;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:9px 10px;min-height:42px}
.card select,.card input[type=date],.card input[type=number]{background:var(--panel);min-height:42px;padding:9px 10px;font-size:15px}
.del{font:inherit;font-size:13px;font-weight:700;color:var(--muted);background:none;border:0;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.add{font:inherit;font-weight:700;font-size:14px;border-radius:6px;padding:9px 14px;cursor:pointer;border:1px dashed var(--rose);background:transparent;color:var(--rose);margin-top:10px}
.total{font-family:var(--head);font-size:clamp(26px,4vw,36px);line-height:1.12;font-weight:700;color:var(--date);margin:4px 0 6px}
.total.empty{color:var(--muted);font-weight:400;font-size:19px;font-family:var(--font)}
.kpis{display:flex;flex-wrap:wrap;gap:8px}
.kpi{background:var(--legal-bg);border-radius:6px;padding:6px 10px;font-size:13px;color:var(--muted)}
.kpi b{display:block;color:var(--ink);font-size:15px;font-variant-numeric:tabular-nums}
.tablewrap{overflow-x:auto;margin-top:8px}
table.dc{width:100%;border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums}
table.dc th,table.dc td{padding:6px 6px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
table.dc th:first-child,table.dc td:first-child{text-align:left;white-space:normal}
table.dc th{font-size:12.5px;color:var(--muted);font-weight:700}
table.dc tr.sum td{font-weight:700;border-bottom:2px solid var(--ink)}
table.dc tr.cr td{background:var(--legal-bg);font-weight:700}
.copyblock{margin-top:12px}
.copyblock .cb-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.copyblock h3{font-family:var(--head);font-size:15px;margin:0}
.copyblock textarea{width:100%;min-height:96px;margin-top:6px;font:13.5px/1.45 var(--font);color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:6px;padding:10px;resize:vertical}
.btn.small{padding:6px 12px;font-size:13px}
.f-rate.is-default{color:var(--muted);background:var(--legal-bg);font-style:italic}
.deflabel{font-weight:400;font-size:11.5px;color:var(--muted);margin-left:4px}
details.mini{margin-top:12px;background:transparent;border:1px solid var(--line);border-radius:6px;padding:8px 12px}
details.mini summary{font-size:13.5px}
details.mini p,details.mini li{font-size:12.5px;color:var(--muted);line-height:1.45}
details.mini ul{margin:6px 0 0;padding-left:18px}
@media (max-width:520px){.card .grid3{grid-template-columns:1fr 1fr}.card .grid3 > :first-child{grid-column:1 / -1}}

.toggles{display:flex;gap:8px;flex-wrap:wrap}
.range{font-size:14px;color:var(--muted);margin-bottom:8px}
.formula{font-size:13px;background:var(--legal-bg);border-radius:8px;padding:8px 10px;margin-top:8px;line-height:1.45}
table.dc td.l, table.dc th.l{text-align:left}
table.dc tr.win td{font-weight:700}
table.dc tr.hl td{background:var(--lrose)}
:root[data-theme="dark"] table.dc tr.hl td{background:#3A1424}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) table.dc tr.hl td{background:#3A1424}}
table.dc td.diff{color:var(--rose);font-weight:700}
.chart{width:100%;height:auto;display:block;margin-top:6px}
.chart text{font-family:var(--font);font-size:11px;fill:var(--muted)}
.chart .axis{stroke:var(--line);stroke-width:1}
.chart .grid{stroke:var(--line);stroke-width:.5;stroke-dasharray:2 3}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:18px;height:3px;vertical-align:middle;margin-right:5px;border-radius:2px}
.muted{color:var(--muted);font-size:12.5px}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
</style>
</head>
<body>
<div class="topband" aria-hidden="true"></div>
<div class="wrap">
  <header>
    <div class="headrow">
      <div class="firm">id est avocats</div>
      <div class="toggles">
        <div class="theme" role="group" data-i18n-aria="themeGroup" aria-label="Affichage">
          <button type="button" data-theme-set="auto" data-i18n="themeAuto">Auto</button><button type="button" data-theme-set="light" data-i18n="themeLight">Clair</button><button type="button" data-theme-set="dark" data-i18n="themeDark">Sombre</button>
        </div>
      </div>
    </div>
    <h1><span data-i18n="title">Marchés publics – notation du prix</span><span class="beta">beta</span></h1>
    <p data-i18n="subtitle"></p>
    <div class="caution" role="note" data-i18n-html="caution"></div>
  </header>

  <div class="grid">
    <form class="panel" id="form" autocomplete="off" onsubmit="return false">
      <fieldset>
        <legend><span class="n">1</span><span data-i18n="lgMethod"></span></legend>
        <label for="method" data-i18n="lbMethod"></label>
        <select id="method">
          <option value="T2" data-i18n="mT2"></option>
          <option value="T15" data-i18n="mT15"></option>
          <option value="T3" data-i18n="mT3"></option>
          <option value="T200" data-i18n="mT200"></option>
          <option value="T300" data-i18n="mT300"></option>
          <option value="Tmoy" data-i18n="mTmoy"></option>
          <option value="T1" data-i18n="mT1"></option>
          <option value="Tlin" data-i18n="mTlin"></option>
        </select>
        <div class="formula" id="formula"></div>
        <div id="tlinBox" hidden>
          <label for="x" data-i18n="lbX"></label>
          <input id="x" type="number" min="1" max="1000" step="1" value="50" inputmode="numeric">
        </div>
        <div id="tmoyBox" hidden>
          <label for="tmoyMode" data-i18n="lbTmoyMode"></label>
          <select id="tmoyMode"><option value="guide" data-i18n="tmGuide"></option><option value="mean" data-i18n="tmMean"></option></select>
          <label for="est" data-i18n="lbEst"></label>
          <input id="est" type="number" min="0" step="1" inputmode="numeric" placeholder="—">
          <div class="hint" data-i18n="hintEst"></div>
        </div>
        <label for="weight" data-i18n="lbWeight"></label>
        <input id="weight" type="number" min="0" max="100" step="1" value="40" inputmode="numeric">
        <div class="hint" id="weightHint"></div>
        <label for="round" data-i18n="lbRound"></label>
        <select id="round"><option value="none" data-i18n="rdNone"></option><option value="2" data-i18n="rd2"></option><option value="1" data-i18n="rd1"></option></select>
      </fieldset>

      <fieldset>
        <legend><span class="n">2</span><span data-i18n="lgOffers"></span></legend>
        <label for="otherMode" data-i18n="lbOtherMode"></label>
        <select id="otherMode"><option value="note" data-i18n="omNote"></option><option value="points" data-i18n="omPoints"></option></select>
        <div class="hint" data-i18n="hintOffers"></div>
        <div class="cards" id="offers" style="margin-top:10px"></div>
        <div class="btnrow">
          <button type="button" class="add" id="addOffer" data-i18n="addOffer"></button>
          <button type="button" class="add" id="example" data-i18n="example"></button>
        </div>
      </fieldset>
    </form>

    <section class="panel result" aria-live="polite" aria-labelledby="rTitle">
      <div class="r-label" id="rTitle" data-i18n="rTitle"></div>
      <div class="total empty" id="rTotal"></div>
      <div class="range" id="rRange"></div>
      <div class="kpis" id="rKpis"></div>
      <div class="alerts" id="rAlerts"></div>
      <div id="rDetails" hidden>
        <h2 data-i18n="hRank"></h2>
        <div class="tablewrap"><table class="dc" id="tRank"></table></div>
        <h2 data-i18n="hThresh"></h2>
        <p class="muted" data-i18n="introThresh"></p>
        <div class="tablewrap"><table class="dc" id="tThresh"></table></div>
        <h2 data-i18n="hCompare"></h2>
        <p class="muted" data-i18n="introCompare"></p>
        <div class="tablewrap"><table class="dc" id="tCompare"></table></div>
        <h2 data-i18n="hChart"></h2>
        <svg class="chart" id="chart" viewBox="0 0 640 300" role="img"></svg>
        <div class="legend" id="legend"></div>
        <div class="copyblock">
          <div class="cb-head"><h3 data-i18n="hSummary"></h3><button type="button" class="btn small" data-copy="txtSum" data-i18n="copy"></button></div>
          <textarea id="txtSum" readonly></textarea>
        </div>
      </div>
      <details class="mini">
        <summary data-i18n="hPrinciples"></summary>
        <ul class="rules" id="principles"></ul>
      </details>
      <details class="mini" id="disclaimer">
        <summary data-i18n="hDisclaimer"></summary>
        <div id="disclaimerText"></div>
      </details>
      <div class="actions">
        <button class="btn ghost" id="print" type="button" data-i18n="print"></button>

<script>
// ===== Marchés publics – notation du prix : moteur =====
// id est avocats, outil d'aide au calcul. À vérifier dans chaque cas.
// SPDX-License-Identifier: AGPL-3.0-or-later
// Méthodes : Guide romand pour les marchés publics (CROMP), annexe T2 (version du 1er mai 2026) ;
// méthode proportionnelle et méthode linéaire paramétrable.
const Notation = (() => {
  const NMAX = 5;
  const METHODS = ['T15', 'T2', 'T3', 'T200', 'T300', 'Tmoy', 'T1', 'Tlin'];
  const clamp = x => Math.max(0, Math.min(NMAX, x));
  const r4 = x => Math.round(x * 1e4) / 1e4;

  // c : { pmin, pmean, n, est, x, tmoyMode: 'guide' | 'mean' }
  function noteOf(m, P, c) {
    const q = c.pmin / P;
    switch (m) {
      case 'T1': return clamp(NMAX * q);
      case 'T15': return clamp(NMAX * Math.pow(q, 1.5));
      case 'T2': return clamp(NMAX * q * q);
      case 'T3': return clamp(NMAX * q * q * q);
      case 'T200': return clamp(NMAX * (2 * c.pmin - P) / c.pmin);
      case 'T300': return clamp(NMAX * (3 * c.pmin - P) / (2 * c.pmin));
      case 'Tlin': { const x = Math.max(1, c.x || 100); return clamp(NMAX * (1 - (P - c.pmin) / (c.pmin * x / 100))); }
      case 'Tmoy': {
        if (c.tmoyMode !== 'mean' && c.n < 5) return c.est > 0 ? clamp(NMAX - (P - c.pmin) / c.est) : NaN;
        const d = c.pmean - c.pmin;
        return d > 0 ? clamp(NMAX - (P - c.pmin) / d) : NMAX;
      }
    }
    return NaN;
  }
  const roundNote = (v, rd) => rd === '2' ? Math.round(v * 100) / 100 : rd === '1' ? Math.round(v * 10) / 10 : v;

  // cfg : { method, weight, offers:[{name, price, other}], otherMode:'note'|'points', est, x, tmoyMode, round }
  function evaluate(cfg, method) {
    const m = method || cfg.method, w = cfg.weight;
    const offers = cfg.offers.filter(o => o.price > 0);
    const n = offers.length;
    if (!n) return null;
    const prices = offers.map(o => o.price);
    const pmin = Math.min(...prices), pmean = prices.reduce((a, b) => a + b, 0) / n;
    const c = { pmin, pmean, n, est: cfg.est, x: cfg.x, tmoyMode: cfg.tmoyMode };
    const rows = offers.map(o => {
      const raw = noteOf(m, o.price, c);
      const note = Number.isFinite(raw) ? roundNote(raw, cfg.round) : NaN;
      const otherPts = cfg.otherMode === 'points' ? (o.other || 0) : (o.other || 0) * (100 - w);
      const pricePts = note * w;
      return { name: o.name, price: o.price, id: o.id, gap: o.price / pmin - 1, raw, note, pricePts, otherPts, total: pricePts + otherPts, other: o.other || 0 };
    });
    const sorted = [...rows].sort((a, b) => b.total - a.total);
    rows.forEach(r => { r.rank = 1 + sorted.filter(s => r4(s.total) > r4(r.total)).length; });
    return { method: m, rows, pmin, pmean, n, ok: rows.every(r => Number.isFinite(r.note)) };
  }

  // Total d’une offre i lorsque son prix vaut P (les autres offres inchangées), et meilleur total des autres
  function margin(cfg, i, P) {
    const offers = cfg.offers.filter(o => o.price > 0).map((o, k) => k === i ? Object.assign({}, o, { price: P }) : o);
    const ev = evaluate(Object.assign({}, cfg, { offers }));
    const me = ev.rows[i], best = Math.max(...ev.rows.filter((_, k) => k !== i).map(r => r.total));
    return me.total - best;
  }
  // Seuils de bascule (méthode annoncée)
  function thresholds(cfg) {
    const ev = evaluate(cfg);
    if (!ev || ev.n < 2 || !ev.ok) return null;
    const w = cfg.weight;
    return ev.rows.map((r, i) => {
      const out = { name: r.name, rank: r.rank };
      if (r.rank === 1) {
        // prix maximal pour rester premier
        let lo = r.price, hi = r.price * 10;
        if (margin(cfg, i, hi) >= 0) out.maxPrice = Infinity;
        else { for (let k = 0; k < 60; k++) { const mid = (lo + hi) / 2; if (margin(cfg, i, mid) >= 0) lo = mid; else hi = mid; } out.maxPrice = lo; }
        out.otherMin = null;
      } else {
        let hi = r.price, lo = r.price * 0.001;
        if (margin(cfg, i, lo) < 0) out.needPrice = null;
        else { for (let k = 0; k < 60; k++) { const mid = (lo + hi) / 2; if (margin(cfg, i, mid) >= 0) lo = mid; else hi = mid; } out.needPrice = lo; }
        // note ou points nécessaires aux autres critères, prix inchangé
        const best = Math.max(...ev.rows.filter((_, k) => k !== i).map(x => x.total));
        const needPts = best - r.pricePts;
        out.needOther = cfg.otherMode === 'points' ? needPts : (100 - w > 0 ? needPts / (100 - w) : Infinity);
        out.otherMax = cfg.otherMode === 'points' ? null : NMAX;
      }
      return out;
    });
  }

  // Avertissements
  function checks(cfg, ev) {
    const notes = [];
    const w = cfg.weight;
    if (w < 20 || w > 80) notes.push({ k: 'weightRange', lvl: 'warn' });
    if (cfg.method === 'Tmoy' && ev.n < 5) notes.push({ k: cfg.tmoyMode === 'mean' ? 'tmoyMeanFew' : (cfg.est > 0 ? 'tmoyEst' : 'tmoyNoEst'), lvl: cfg.tmoyMode !== 'mean' && !(cfg.est > 0) ? 'bad' : 'warn' });
    if (cfg.method === 'Tmoy' && ev.n >= 5) {
      const big = ev.rows.some(r => r.gap > 1);
      if (big) notes.push({ k: 'tmoyOutlier', lvl: 'warn' });
    }
    if (ev.n === 2 && cfg.method !== 'Tmoy') notes.push({ k: 'twoOffers', lvl: 'info' });
    const low = [];
    if (ev.n >= 3) ev.rows.forEach((r, i) => {
      const others = ev.rows.filter((_, k) => k !== i).map(x => x.price);
      const mo = others.reduce((a, b) => a + b, 0) / others.length;
      if (r.price < 0.7 * mo) low.push({ name: r.name, pct: 1 - r.price / mo });
    });
    low.forEach(l => notes.push({ k: 'abnLow', lvl: 'warn', data: l }));
    const zeros = ev.rows.filter(r => r.note === 0);
    if (zeros.length) notes.push({ k: 'zeroNote', lvl: 'info', data: zeros.map(z => z.name) });
    if (cfg.otherMode !== 'points' && ev.rows.some(r => r.other < 0 || r.other > NMAX)) notes.push({ k: 'otherRange', lvl: 'bad' });
    const top = ev.rows.filter(r => r.rank === 1);
    if (top.length > 1) notes.push({ k: 'tieTop', lvl: 'warn' });
    // poids effectif du prix : écart de points prix entre la moins chère et la plus chère, rapporté au poids maximal
    if (ev.n >= 2) {
      const spread = Math.max(...ev.rows.map(r => r.pricePts)) - Math.min(...ev.rows.map(r => r.pricePts));
      const gapMax = Math.max(...ev.rows.map(r => r.gap));
      if (gapMax >= 0.2 && spread < 0.2 * w * NMAX) notes.push({ k: 'flat', lvl: 'warn', data: { gap: gapMax, share: spread / (w * NMAX) } });
    }
    return notes;
  }

  function compareAll(cfg) {
    return METHODS.map(m => {
      const ev = evaluate(cfg, m);
      if (!ev || !ev.ok) return { method: m, ok: false };
      const winners = ev.rows.filter(r => r.rank === 1).map(r => r.name);
      return { method: m, ok: true, rows: ev.rows, winners };
    });
  }
  // Courbe d’une méthode pour un écart de prix donné (0 = prix le plus bas)
  function curve(cfg, m, gap, ev) {
    const c = { pmin: ev.pmin, pmean: ev.pmean, n: ev.n, est: cfg.est, x: cfg.x, tmoyMode: cfg.tmoyMode };
    return noteOf(m, ev.pmin * (1 + gap), c);
  }
  return { METHODS, NMAX, noteOf, evaluate, thresholds, checks, compareAll, curve };
})();

</script>

  [...document.querySelectorAll('#offers .card')].forEach((c, i) => {
    c.querySelector('.of-title').textContent = t.offerN(i + 1);
    c.querySelector('.o-otherLabel').textContent = pts ? t.lbOtherPts : t.lbOtherNote;
    c.querySelector('.o-other').max = pts ? '' : '5';
  });
}
const num = v => { const x = parseFloat(String(v).replace(',', '.')); return Number.isFinite(x) ? x : null; };
function readOffers() {
  return [...document.querySelectorAll('#offers .card')].map((c, i) => ({
    id: c.dataset.id, no: i + 1,
    name: c.querySelector('.o-name').value.trim() || T().offerN(i + 1),
    price: num(c.querySelector('.o-price').value),
    other: num(c.querySelector('.o-other').value) || 0,
  })).filter(o => o.price !== null && o.price > 0);
}

// ---------- Traduction ----------
function translate(root = document) {
  const t = T();
  root.querySelectorAll('[data-i18n]').forEach(e => { const v = t[e.dataset.i18n]; if (typeof v === 'string') e.textContent = v; });
  root.querySelectorAll('[data-i18n-html]').forEach(e => { e.innerHTML = t[e.dataset.i18nHtml]; });
  root.querySelectorAll('[data-i18n-aria]').forEach(e => { e.setAttribute('aria-label', t[e.dataset.i18nAria]); });
}
function applyLang() {
  const t = T();
  document.documentElement.lang = LANG;
  document.title = t.pageTitle;
  translate();
  $('#principles').innerHTML = t.principles.map(p => `<li>${p}</li>`).join('');
  $('#disclaimerText').innerHTML = t.disclaimer.map(p => `<p>${p}</p>`).join('');
  renumber(); setSource(); update();
}

// ---------- Graphique ----------
const COLORS = { T15: '#069297', T2: '#F7A823', T3: '#9E0F47', T200: '#5A7D9A', T300: '#8C8C93', Tmoy: '#2E8B57', T1: '#B5651D', Tlin: '#6A4C93' };
function drawChart(cfg, ev) {
  const t = T(), W = 640, H = 300, L = 44, R = 14, TOP = 12, B = 40;
  const gapMax = Math.max(...ev.rows.map(r => r.gap));
  const xMax = Math.min(3, Math.max(0.5, Math.ceil(gapMax * 1.25 / 0.25) * 0.25));
  const X = g => L + (W - L - R) * g / xMax, Y = n => TOP + (H - TOP - B) * (1 - n / 5);
  let s = '';
  for (let n = 0; n <= 5; n++) s += `<line class="grid" x1="${L}" x2="${W - R}" y1="${Y(n)}" y2="${Y(n)}"/><text x="${L - 8}" y="${Y(n) + 4}" text-anchor="end">${n}</text>`;
  const step = xMax <= 1 ? 0.1 : xMax <= 2 ? 0.25 : 0.5;
  for (let g = 0; g <= xMax + 1e-9; g += step) s += `<line class="grid" x1="${X(g)}" x2="${X(g)}" y1="${TOP}" y2="${H - B}"/><text x="${X(g)}" y="${H - B + 16}" text-anchor="middle">+${Math.round(g * 100)} %</text>`;
  s += `<line class="axis" x1="${L}" x2="${W - R}" y1="${H - B}" y2="${H - B}"/><line class="axis" x1="${L}" x2="${L}" y1="${TOP}" y2="${H - B}"/>`;
  s += `<text x="${(L + W - R) / 2}" y="${H - 6}" text-anchor="middle">${t.axX}</text>`;
  const pts = m => { const a = []; for (let k = 0; k <= 120; k++) { const g = xMax * k / 120, v = N.curve(cfg, m, g, ev); if (Number.isFinite(v)) a.push(`${X(g).toFixed(1)},${Y(v).toFixed(1)}`); } return a.join(' '); };
  const legend = [];
  N.METHODS.forEach(m => {
    if (m === cfg.method) return;
    const p = pts(m); if (!p) return;
    s += `<polyline points="${p}" fill="none" stroke="${COLORS[m]}" stroke-width="1.4" opacity=".75"/>`;
    legend.push(`<span><i style="background:${COLORS[m]}"></i>${t.short[m]}${m === 'Tlin' ? ' ' + cfg.x + ' %' : ''}</span>`);
  });
  const pm = pts(cfg.method);
  if (pm) s += `<polyline points="${pm}" fill="none" stroke="var(--rose)" stroke-width="3.2"/>`;
  [...ev.rows].sort((p, q) => p.gap - q.gap).forEach((r, k) => { if (Number.isFinite(r.note) && r.gap <= xMax) s += `<circle cx="${X(r.gap)}" cy="${Y(r.note)}" r="5" fill="var(--panel)" stroke="var(--rose)" stroke-width="2.4"><title>${esc(r.name)} : ${f2(r.note)}</title></circle><text x="${X(r.gap) + 8}" y="${Y(r.note) + (k % 2 ? 18 : -9)}" style="fill:var(--ink)">${esc(r.name.length > 14 ? r.name.slice(0, 13) + '…' : r.name)}</text>`; });
  $('#chart').innerHTML = s;
  $('#chart').setAttribute('aria-label', t.hChart);
  $('#legend').innerHTML = `<span><i style="background:var(--rose);height:4px"></i><b>${t.short[cfg.method]}${cfg.method === 'Tlin' ? ' ' + cfg.x + ' %' : ''}</b></span>` + legend.join('');
}

// ---------- Calcul et affichage ----------
function update() {
  const t = T();
  const method = $('#method').value;
  $('#formula').innerHTML = t.formula[method];
  $('#tlinBox').hidden = method !== 'Tlin';
  $('#tmoyBox').hidden = method !== 'Tmoy';
  const weight = Math.max(0, Math.min(100, num($('#weight').value) ?? 0));
  $('#weightHint').textContent = t.weightHint(fmt0(100 - weight));
  const cfg = { method, weight, otherMode: $('#otherMode').value, est: num($('#est').value) || 0, x: Math.max(1, num($('#x').value) || 100), tmoyMode: $('#tmoyMode').value, round: $('#round').value, offers: readOffers() };
  const ev = cfg.offers.length >= 2 ? N.evaluate(cfg) : null;
  if (!ev) {
    $('#rTotal').className = 'total empty'; $('#rTotal').textContent = t.emptyTotal;
    $('#rRange').textContent = ''; $('#rKpis').innerHTML = ''; $('#rAlerts').innerHTML = ''; $('#rDetails').hidden = true;
    return;
  }
  const label = t.short[method] + (method === 'Tlin' ? ' ' + cfg.x + ' %' : '');
  const alerts = N.checks(cfg, ev).map(a => ({ lvl: a.lvl, html: typeof t.n[a.k] === 'function' ? t.n[a.k](a.data) : t.n[a.k] }));
  $('#rAlerts').innerHTML = alerts.map(x => `<div class="alert ${x.lvl}">${x.html}</div>`).join('');
  $('#rKpis').innerHTML = `<span class="kpi">${t.kPmin}<b>CHF ${fmt(ev.pmin)}</b></span><span class="kpi">${t.kPmean}<b>CHF ${fmt(ev.pmean)}</b></span><span class="kpi">${t.kN}<b>${ev.n}</b></span>`;
  if (!ev.ok) {
    $('#rTotal').className = 'total empty'; $('#rTotal').textContent = '—'; $('#rRange').textContent = ''; $('#rDetails').hidden = true;
    return;
  }
  const winners = ev.rows.filter(r => r.rank === 1);
  $('#rTotal').className = 'total';
  $('#rTotal').textContent = (winners.length > 1 ? t.tie : '') + winners.map(w => w.name).join(', ');
  $('#rRange').textContent = t.rangeTxt(f2(winners[0].total), 500, label);

  // Classement
  const sorted = [...ev.rows].sort((a, b) => a.rank - b.rank || a.price - b.price);
  $('#tRank').innerHTML = `<thead><tr><th>${t.thRank}</th><th class="l">${t.thName}</th><th>${t.thPrice}</th><th>${t.thGap}</th><th>${t.thNote}</th><th>${t.thPP}</th><th>${t.thOP}</th><th>${t.thTot}</th></tr></thead><tbody>`
    + sorted.map(r => `<tr class="${r.rank === 1 ? 'win' : ''}"><td>${r.rank}</td><td class="l">${esc(r.name)}</td><td>${fmt(r.price)}</td><td>+${pct(r.gap)} %</td><td>${f3(r.note)}</td><td>${f2(r.pricePts)}</td><td>${f2(r.otherPts)}</td><td>${f2(r.total)}</td></tr>`).join('') + '</tbody>';

  // Seuils
  const th = N.thresholds(cfg) || [];
  const pts = cfg.otherMode === 'points';
  const thRows = th.map((x, i) => {
    const r = ev.rows[i];
    if (x.rank === 1) {
      const p = x.maxPrice === Infinity ? t.noLimit : `${t.staysFirst} CHF ${fmt(x.maxPrice)}`;
      const v = x.maxPrice === Infinity ? '—' : `+${pct(x.maxPrice / r.price - 1)} %`;
      return { r, html: `<td class="l">${esc(r.name)}</td><td>${fmt(r.price)}</td><td class="l">${p}</td><td>${v}</td><td>—</td>`, x };
    }
    const p = x.needPrice === null ? t.impossible : `${t.becomesFirst} CHF ${fmt(x.needPrice)}`;
    const v = x.needPrice === null ? '—' : `−${pct(1 - x.needPrice / r.price)} %`;
    const need = pts ? t.needNote(f2(x.needOther), f2(r.other)) : (x.needOther > 5 ? t.needImpossible(f2(x.needOther)) : t.needNote(f2(x.needOther), f2(r.other)));
    return { r, html: `<td class="l">${esc(r.name)}</td><td>${fmt(r.price)}</td><td class="l">${p}</td><td>${v}</td><td class="l">${need}</td>`, x };
  }).sort((a, b) => a.r.rank - b.r.rank);
  $('#tThresh').innerHTML = `<thead><tr><th class="l">${t.thName}</th><th>${t.thPrice}</th><th class="l">${t.thThresh}</th><th>${t.thVar}</th><th class="l">${t.thNeed}</th></tr></thead><tbody>` + thRows.map(z => `<tr>${z.html}</tr>`).join('') + '</tbody>';

  // Comparaison
  const comp = N.compareAll(cfg);
  const names = ev.rows.map(r => r.name);
  const refWin = winners.map(w => w.name).join(', ');
  $('#tCompare').innerHTML = `<thead><tr><th class="l">${t.thMethod}</th>${names.map(n => `<th>${esc(n)}</th>`).join('')}<th class="l">${t.thFirst}</th></tr></thead><tbody>`
    + comp.map(c => {
      const lab = t.short[c.method] + (c.method === 'Tlin' ? ' ' + cfg.x + ' %' : '');
      if (!c.ok) return `<tr class="${c.method === method ? 'hl' : ''}"><td class="l">${lab}</td>${names.map(() => '<td>—</td>').join('')}<td class="l">${t.estNeeded}</td></tr>`;
      const w = c.winners.join(', ');
      return `<tr class="${c.method === method ? 'hl' : ''}"><td class="l">${lab}</td>${c.rows.map(r => `<td>${f2(r.note)}</td>`).join('')}<td class="l ${w !== refWin ? 'diff' : ''}">${esc(w)}</td></tr>`;
    }).join('') + '</tbody>';

  drawChart(cfg, ev);

  // Résumé
  const plain = h => h.replace(/<sup>([^<]*)<\/sup>/g, '^$1').replace(/<[^>]+>/g, '');
  const lines = [t.sumTitle(label), t.sumFormula(plain(t.formula[method])), t.sumWeight(fmt0(weight), fmt0(100 - weight)), t.sumMarket(fmt(ev.pmin), fmt(ev.pmean), ev.n), ''];
  sorted.forEach(r => lines.push(t.sumRow(r.rank, r.name, fmt(r.price), pct(r.gap), f3(r.note), f2(r.pricePts), f2(r.otherPts), f2(r.total))));
  lines.push('', t.sumWinner(refWin));
  thRows.forEach(z => {
    const x = z.x, r = z.r;
    if (x.rank === 1) { if (x.maxPrice !== Infinity) lines.push(t.sumStays(r.name, fmt(x.maxPrice), pct(x.maxPrice / r.price - 1))); return; }
    const o = pts ? t.sumOtherPts(f2(x.needOther)) : (x.needOther <= 5 ? t.sumOtherNote(f2(x.needOther)) : '');
    lines.push(x.needPrice === null ? t.sumNoPrice(r.name, o) : t.sumBecomes(r.name, fmt(x.needPrice), pct(1 - x.needPrice / r.price), o));
  });
  const diffs = comp.filter(c => c.ok && c.winners.join(', ') !== refWin).map(c => `${t.short[c.method]}${c.method === 'Tlin' ? ' ' + cfg.x + ' %' : ''} : ${c.winners.join(', ')}`);
  lines.push(diffs.length ? t.sumCompare(diffs.join(' ; ')) : t.sumSame, '', t.sumEnd);
  $('#txtSum').value = lines.join('\n');
  $('#txtSum').rows = Math.min(24, lines.length + 2);
  $('#rDetails').hidden = false;
}

// ---------- Événements ----------
['#method', '#x', '#tmoyMode', '#est', '#weight', '#round'].forEach(s => { $(s).addEventListener('input', update); $(s).addEventListener('change', update); });
$('#otherMode').addEventListener('change', () => { renumber(); update(); });
$('#addOffer').onclick = () => { offerCard(); update(); };
$('#example').onclick = () => {
  const n = T().exNames;
  $('#offers').innerHTML = '';
  $('#otherMode').value = 'note'; $('#method').value = 'T2'; $('#weight').value = 40;
  [[n[0], 1080000, 3.2], [n[1], 1250000, 4.4], [n[2], 1310000, 4.8], [n[3], 1620000, 4.5]].forEach(([name, price, other]) => offerCard({ name, price, other }));
  update();
};
document.querySelectorAll('[data-copy]').forEach(b => b.addEventListener('click', async () => {
  const ta = document.getElementById(b.dataset.copy);
  try { await navigator.clipboard.writeText(ta.value); } catch (e) { ta.select(); try { document.execCommand('copy'); } catch (_) {} }
  b.textContent = T().copied; setTimeout(() => { b.textContent = T().copy; }, 1500);
}));
$('#print').addEventListener('click', () => window.print());
$('#reset').addEventListener('click', () => { $('#method').value = 'T2'; $('#x').value = 50; $('#tmoyMode').value = 'guide'; $('#est').value = ''; $('#weight').value = 40; $('#round').value = 'none'; $('#otherMode').value = 'note'; $('#offers').innerHTML = ''; offerCard(); offerCard(); offerCard(); update(); });

function applyTheme(th) {
  if (th === 'light' || th === 'dark') document.documentElement.setAttribute('data-theme', th); else document.documentElement.removeAttribute('data-theme');
  document.querySelectorAll('[data-theme-set]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.themeSet === (th || 'auto'))));
}
document.querySelectorAll('[data-theme-set]').forEach(b => b.addEventListener('click', () => { const th = b.dataset.themeSet; store.set('theme', th); applyTheme(th); }));
applyTheme(store.get('theme', 'auto'));

// Lien vers le code source (art. 13 AGPL), lorsque l’outil est servi par GitHub Pages
function setSource() {
  const h = location.hostname;
  if (/\.github\.io$/.test(h)) {
    const user = h.split('.')[0], repo = location.pathname.split('/').filter(Boolean)[0];
    const url = `https://github.com/${user}${repo ? '/' + repo : ''}`;
    $('#srcLink').innerHTML = `${T().source} <a href="${url}">${url.replace('https://', '')}</a>`;
  } else $('#srcLink').hidden = true;
}

// ---------- Démarrage ----------
offerCard(); offerCard(); offerCard();
applyLang();
})();
</script>
